services:
  grafana:
    image: simpledotorg/heart360tk-grafana:${HEART360TK_VERSION}
    container_name: grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - GF_DATABASE_URL=postgres://grafana:ZDI5MGE3YmYyMTRlNGNmYThkMTYyZjk3@postgres:5432/${POSTGRES_DB}
      - GF_SECURITY_ADMIN_PASSWORD=Admin@Heart360

  postgres:
    image: simpledotorg/heart360tk-postgresql:${HEART360TK_VERSION}
    container_name: postgres
    ports:
      - 5432:5432
    restart: unless-stopped
    volumes:
      - h360tk_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 5s
      timeout: 60s
      retries: 5
      start_period: 80s

  file-processor:
    image: simpledotorg/heart360tk-fileprocessor:${HEART360TK_VERSION}
    container_name: file-upload-trigger
    environment:
      - H360TK_DATA_LOAD_SCRIPT=/scripts/ingest_file_puskesmas.py
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./ingest_file_puskesmas.py:/scripts/ingest_file_puskesmas.py
      - .upload:/data:rw

###
# For now, still taken from the base image
###
# TODO: have configuration (like users) dumped out of the container, to avoid losing it
# when reinstalling
  filebrowser:
    image: gtstef/filebrowser:stable-slim
    container_name: filebrowser-quantum
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .upload:/srv:rw
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=admin
      - FILEBROWSER_BASEURL=/

  exporter:
    image: simpledotorg/heart360tk-exporter:${HEART360TK_VERSION}
    container_name: h360tk-exporter
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - SOURCE_KEY=${SOURCE_KEY:-}
      - EXPORT_CRON=${EXPORT_CRON:-}
      - UPLOAD_PROTOCOL=${UPLOAD_PROTOCOL:-}
      - UPLOAD_DEST_PATH=${UPLOAD_DEST_PATH:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-}
      - POSTGRES_DB=${POSTGRES_DB:-}
      - POSTGRES_USER=${POSTGRES_USER}:-
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - SFTP_HOST=${SFTP_HOST:-}
      - SFTP_PORT=${SFTP_PORT:-}
      - SFTP_USER=${SFTP_USER:-}
      - SFTP_PASSWORD=${SFTP_PASSWORD:-}
      - SFTP_DEST_PATH=${SFTP_DEST_PATH:-}
      - SFTP_TIMEOUT=${SFTP_TIMEOUT:-60}
    volumes:
      - ./export:/export:rw

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
      - grafana

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  prometheus_data:
  h360tk_database:

