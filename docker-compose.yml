services:
  grafana:
    image: simpledotorg/heart360tk-grafana:${HEART360TK_VERSION:?set HEART360TK_VERSION in .env}
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      GF_DATABASE_URL: ${GF_DATABASE_URL:?set GF_DATABASE_URL in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
    volumes:
      - "./grafana_provisioning/dashboards/HEARTS360 Dashboards/heart360.hypertension-diabetes.program.json:/etc/grafana/provisioning/dashboards/HEARTS360 Dashboards/heart360.hypertension-diabetes.program.json:ro"

  postgres:
    image: simpledotorg/heart360tk-postgresql:${HEART360TK_VERSION}
    container_name: postgres
    restart: unless-stopped
    volumes:
      - ./.database:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - app.is_central_node=true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:?set POSTGRES_DB in .env}"]
      interval: 5s
      timeout: 60s
      retries: 5
      start_period: 80s

  sftp:
    image: atmoz/sftp:latest
    container_name: h360tk-sftp
    restart: unless-stopped
    ports:
      - "2222:22"
    volumes:
      - ./sftp_config/users.conf:/etc/sftp/users.conf:ro
      - ./data/sftp-upload:/home/h360tk_sftp/upload
      - ./sftp_config/host_keys/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key
      - ./sftp_config/host_keys/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key

  importer:
    image: local/h360tk-importer:0.6.0-patched-20261022
    build:
      context: .
      dockerfile: docker_build/heart360.central-importer-patch.docker
    container_name: h360tk-importer
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      IMPORT_CRON: ${IMPORT_CRON:?set IMPORT_CRON in .env}
      IMPORT_PROTOCOL: ${IMPORT_PROTOCOL:?set IMPORT_PROTOCOL in .env}
      IMPORT_AGGREGATE_DATA: ${IMPORT_AGGREGATE_DATA:?set IMPORT_AGGREGATE_DATA in .env}
      ORGUNIT_MAPPING_PATH: /config/orgunit_mapping/mapping.yaml
      IMPORT_FOLDER_PATH: ${IMPORT_FOLDER_PATH}
      POSTGRES_HOST: ${POSTGRES_HOST:?set POSTGRES_HOST in .env}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SFTP_HOST: ${SFTP_HOST}
      SFTP_PORT: ${SFTP_PORT}
      SFTP_USER: ${SFTP_USER}
      SFTP_PASSWORD: ${SFTP_PASSWORD}
      SFTP_TIMEOUT: ${SFTP_TIMEOUT}
      S3_BUCKET: ${S3_BUCKET}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
    volumes:
      - ./config/orgunit_mapping:/config/orgunit_mapping:ro
