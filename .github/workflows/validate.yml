name: Validate central 0.6.0

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned importer test dependencies
        run: |
          python -m pip install psycopg2-binary==2.9.9 APScheduler==3.10.4 paramiko==3.5.1 PyYAML==6.0.2
      - name: Validate Compose and Indonesia mapping
        run: |
          docker compose --env-file .env.example config --quiet
          python -c "import yaml; d=yaml.safe_load(open('config/orgunit_mapping/mapping.yaml', encoding='utf-8')); assert len(d) == 4"
      - name: Test importer and program dashboard
        env:
          PYTHONPATH: importer_scripts
        run: |
          python -m unittest discover -s importer_scripts -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_*.py' -v
